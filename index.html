<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Tropa GB Pods </title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#111;
      color:white;
    }
header{
  padding:30px 20px;
  text-align:center;
  background:#000;
}

.logo{
  width:220px;
  height:220px;
  object-fit:cover;
  border-radius:50%;
  border:6px solid white;
  background:#000;
  box-shadow:0 0 30px rgba(255,255,255,0.2);
}

.titulo{
  margin-top:15px;
  font-size:32px;
  font-weight:bold;
  color:white;
  letter-spacing:2px;
    }

    .container{
      width:90%;
      max-width:550px;
      margin:30px auto;
      background:#1a1a1a;
      padding:25px;
      border-radius:20px;
      border:2px solid red;
      box-shadow:0 0 25px rgba(255,0,0,0.2);
    }

    h2{
      text-align:center;
      color:#ff3b3b;
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-top:18px;
      margin-bottom:8px;
      color:#ff4d4d;
      font-weight:bold;
    }

    select,
    input,
    textarea{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2a2a2a;
      color:white;
      font-size:15px;
    }

    textarea{
      height:100px;
      resize:none;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:25px;
      border:none;
      border-radius:12px;
      background:red;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#cc0000;
    }

    .resultado{
      display:none;
      margin-top:25px;
      background:#222;
      padding:20px;
      border-radius:15px;
      border:1px solid red;
    }

    footer{
      text-align:center;
      padding:25px;
      color:#888;
    }

  </style>
</head>
<body>

<header>

  <img 
    src="IMG-20260523-WA0008.jpg"
    class="logo"
  >

  <div class="titulo">
    TROPA GB PODS 
  </div>

</header>

<div class="container">

  <h2>Monte Seu Pedido</h2>

  <!-- POD -->
  <label>Escolha o Pod</label>

  <select id="pod" onchange="atualizarSabores()">

    <option value="">Selecione</option>

    <option value="V80">V80 - R$130</option>

    <option value="V250">V250 - R$160</option>

    <option value="V150">V150 - R$150</option>

    <option value="Black Sheep 15K">
      Black Sheep 15K - R$150
    </option>

    <option value="Black Sheep 55K">
      Black Sheep 55K - R$190
    </option>

  </select>

  <!-- SABOR -->
  <label>Escolha o Sabor</label>

  <select id="sabores">

    <option>
      Escolha um pod primeiro
    </option>

  </select>

  <!-- NOME -->
  <label>Seu Nome</label>

  <input 
    type="text"
    id="nome"
    placeholder="Digite seu nome"
  >

  <!-- OBS -->
  <label>Observação</label>

  <textarea 
    id="obs"
    placeholder="Ex: troco, entrega rápida..."
  ></textarea>

  <!-- BOTÃO -->
  <button onclick="enviarWhatsapp()">
    Fazer Pedido
  </button>

  <!-- RESULTADO -->
  <div class="resultado" id="resultado"></div>

</div>

<footer>
  © 2026 TROPA GB PODS
</footer>

<script>

  // SABORES POR POD
  const sabores = {

    "V80": [
      "Uva Ice",
      "Frozen Morango",
      "Menta Chiclete",
      "Maracujá Kiwi",
      "Melancia Ice"
    ],

    "V250": [
      "Melão Minty",
      "Aloé Grape",
      "Morango Banana"
    ],

    "V150": [
      "Framboesa"
    ],

    "Black Sheep 15K": [
      "Maracujá",
      "Manga Pêssego Melancia",
      "Melancia Morango",
      "Menthol"
    ],

    "Black Sheep 55K": [
      "Cool Mint",
      "Melancia Ice"
    ]

  };

  // ATUALIZAR SABORES
  function atualizarSabores(){

    const pod =
      document.getElementById("pod").value;

    const select =
      document.getElementById("sabores");

    select.innerHTML = "";

    if(!pod){

      select.innerHTML =
      "<option>Escolha um pod primeiro</option>";

      return;

    }

    sabores[pod].forEach(function(sabor){

      const option =
        document.createElement("option");

      option.value = sabor;

      option.textContent = sabor;

      select.appendChild(option);

    });

  }

  // WHATSAPP
  function enviarWhatsapp(){

    const pod =
      document.getElementById("pod").value;

    const sabor =
      document.getElementById("sabores").value;

    const nome =
      document.getElementById("nome").value;

    const obs =
      document.getElementById("obs").value;

    if(!pod){

      alert("Escolha um pod!");

      return;

    }

    const mensagem = 
`Olá, gostaria de fazer um pedido!

👤 Nome: ${nome}

🔥 Pod Escolhido: ${pod}

🍓 Sabor: ${sabor}

📝 Observação: ${obs}`;

    const numero = "558486774080";

    const url =
`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

    window.open(url, "_blank");

    // RESULTADO VISUAL
    const resultado =
      document.getElementById("resultado");

    resultado.style.display = "block";

    resultado.innerHTML = `

      <h3 style="color:#ff3b3b;">
        Pedido enviado com sucesso ✅
      </h3>

      <br>

      <p><b>Pod:</b> ${pod}</p>

      <p><b>Sabor:</b> ${sabor}</p>

    `;

  }

</script>

</body>
</html>
