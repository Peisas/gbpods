<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GB PODS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#0d0d0d;
  color:white;
}

header{
  background:linear-gradient(180deg,#000,#111);
  padding:20px;
  border-bottom:1px solid rgba(255,0,0,0.2);
}

.topo{
  display:flex;
  justify-content:flex-end;
}

.logo-area{
  text-align:center;
  margin-top:10px;
}

.logo{
  width:180px;
  height:180px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid white;
  box-shadow:
  0 0 40px rgba(255,0,0,0.4),
  0 0 80px rgba(255,255,255,0.1);
}

.titulo{
  margin-top:15px;
  font-size:32px;
  font-weight:700;
  letter-spacing:3px;
}

.subtitulo{
  margin-top:8px;
  color:#999;
  font-size:14px;
}

.admin-btn{
  padding:12px 18px;
  border:none;
  border-radius:14px;
  background:red;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:650px;
  margin:30px auto;
}

.card{
  background:linear-gradient(180deg,#1b1b1b,#111);
  border:1px solid rgba(255,0,0,0.2);
  border-radius:28px;
  padding:25px;
  box-shadow:0 0 30px rgba(255,0,0,0.1);
  margin-bottom:25px;
}

h2{
  margin-bottom:20px;
  font-size:24px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:10px;
  color:#ff4d4d;
  font-weight:600;
}

select,
input,
textarea{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:#222;
  color:white;
  font-size:15px;
}

textarea{
  resize:none;
  height:100px;
}

button{
  width:100%;
  padding:16px;
  margin-top:18px;
  border:none;
  border-radius:16px;
  background:red;
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#cc0000;
}

.itemCarrinho{
  background:#1c1c1c;
  padding:15px;
  border-radius:18px;
  margin-top:15px;
}

.remover-btn{
  margin-top:10px;
  background:#333;
}

.total{
  margin-top:20px;
  font-size:22px;
  font-weight:700;
  color:#00ff88;
}

footer{
  text-align:center;
  padding:40px 20px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  overflow:auto;
  padding:20px;
}

.admin-produto{
  background:#1c1c1c;
  padding:15px;
  border-radius:18px;
  margin-top:15px;
}

.sabores-box{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.sabor-tag{
  background:red;
  padding:6px 12px;
  border-radius:12px;
  font-size:13px;
}

@media(max-width:600px){

  .logo{
    width:140px;
    height:140px;
  }

  .titulo{
    font-size:24px;
  }

}

</style>

</head>

<body>

<header>

<div class="topo">

<button
class="admin-btn"
onclick="abrirAdmin()"
>
🔒 Sou Sócio
</button>

</div>

<div class="logo-area">

<img
src="IMG-20260523-WA0008.jpg"
class="logo"
>

<div class="titulo">
TROPA GB PODS
</div>

<div class="subtitulo">
Os melhores pods da região 🚀
</div>

</div>

</header>

<div class="container">

<div class="card">

<h2>Monte Seu Pedido</h2>

<label>Escolha o Pod</label>

<select
id="pod"
onchange="atualizarSabores()"
></select>

<label>Escolha o Sabor</label>

<select id="sabores"></select>

<label>Seu Nome</label>

<input
type="text"
id="nome"
placeholder="Digite seu nome"
>

<label>Observação</label>

<textarea
id="obs"
placeholder="Ex: troco, entrega rápida..."
></textarea>

<button onclick="adicionarCarrinho()">
Adicionar ao Carrinho
</button>

<button onclick="enviarWhatsapp()">
Finalizar Pedido
</button>

</div>

<div class="card">

<h2>🛒 Carrinho</h2>

<div id="itensCarrinho"></div>

<div class="total">
Total: R$ <span id="total">0</span>
</div>

<label>Forma de Pagamento</label>

<select
id="pagamento"
onchange="mostrarTroco()"
>

<option>Selecione</option>
<option>Dinheiro</option>
<option>Cartão</option>
<option>Pix</option>

</select>

<div
id="trocoArea"
style="display:none;"
>

<label>Troco para quanto?</label>

<input
type="number"
id="troco"
placeholder="Ex: 200"
>

</div>

</div>

</div>

<div
class="modal"
id="adminModal"
>

<div class="container">

<div class="card">

<button onclick="fecharAdmin()">
Fechar
</button>

<h2>Painel Administrativo</h2>

<input
type="text"
id="login"
placeholder="Login"
>

<input
type="password"
id="senha"
placeholder="Senha"
style="margin-top:15px;"
>

<button onclick="fazerLogin()">
Entrar
</button>

<div
id="painelAdmin"
style="display:none;"
>

<hr style="
margin:25px 0;
border-color:#333;
">

<h2>Adicionar Produto</h2>

<input
type="text"
id="novoNome"
placeholder="Nome do Pod"
>

<input
type="number"
id="novoPreco"
placeholder="Preço"
style="margin-top:15px;"
>

<input
type="text"
id="novoSabores"
placeholder="Sabores separados por vírgula"
style="margin-top:15px;"
>

<button onclick="adicionarProduto()">
Adicionar Produto
</button>

<div
id="listaAdmin"
style="margin-top:25px;"
></div>

</div>

</div>

</div>

</div>

<footer>
© 2026 TROPA GB PODS
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
remove,
update
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyBNDan8JRq3BL6fHMLprioT6XZEzRsaCjg",
authDomain: "gbpods-da517.firebaseapp.com",
databaseURL: "https://gbpods-da517-default-rtdb.firebaseio.com",
projectId: "gbpods-da517",
storageBucket: "gbpods-da517.firebasestorage.app",
messagingSenderId: "833362880198",
appId: "1:833362880198:web:4080cbfa85a0d4b5e559c7",
measurementId: "G-N5Z9XY25SD"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let produtos = [];
let carrinho = [];

const produtosRef = ref(db, "produtos");

onValue(produtosRef, (snapshot) => {

const dados = snapshot.val();

produtos = [];

if(dados){

Object.keys(dados).forEach(key => {

produtos.push({
firebaseId:key,
...dados[key]
});

});

}

if(produtos.length === 0){

const iniciais = [

{
nome:"V80",
preco:130,
sabores:[
"Uva Ice",
"Frozen Morango",
"Menta Chiclete",
"Maracujá Kiwi",
"Melancia Ice"
]
},

{
nome:"V250",
preco:160,
sabores:[
"Melão Minty",
"Aloé Grape",
"Morango Banana"
]
}

];

iniciais.forEach(produto => {
push(produtosRef, produto);
});

}

carregarProdutos();
carregarAdmin();

});

function carregarProdutos(){

const select = document.getElementById("pod");

select.innerHTML = "";

produtos.forEach((produto,index) => {

select.innerHTML += `
<option value="${index}">
${produto.nome} - R$${produto.preco}
</option>
`;

});

atualizarSabores();

}

window.atualizarSabores = function(){

const podId = Number(document.getElementById("pod").value);

const saboresSelect = document.getElementById("sabores");

saboresSelect.innerHTML = "";

const produto = produtos[podId];

if(!produto) return;

produto.sabores.forEach(sabor => {

saboresSelect.innerHTML += `
<option>${sabor}</option>
`;

});

}

window.adicionarCarrinho = function(){

const podId = Number(document.getElementById("pod").value);
const sabor = document.getElementById("sabores").value;

const produto = produtos[podId];

carrinho.push({
pod:produto.nome,
sabor:sabor,
preco:produto.preco
});

atualizarCarrinho();

}

window.removerCarrinho = function(index){

carrinho.splice(index,1);

atualizarCarrinho();

}

function atualizarCarrinho(){

const itens = document.getElementById("itensCarrinho");
const total = document.getElementById("total");

itens.innerHTML = "";

let soma = 0;

carrinho.forEach((item,index) => {

soma += item.preco;

itens.innerHTML += `
<div class="itemCarrinho">
<h3>${item.pod}</h3>
<p>${item.sabor}</p>
<p>R$ ${item.preco}</p>
<button
class="remover-btn"
onclick="removerCarrinho(${index})"
>
Remover
</button>
</div>
`;

});

total.innerText = soma;

}

window.mostrarTroco = function(){

const pagamento = document.getElementById("pagamento").value;

document.getElementById("trocoArea").style.display =
pagamento == "Dinheiro"
? "block"
: "none";

}

window.enviarWhatsapp = function(){

const nome = document.getElementById("nome").value;
const obs = document.getElementById("obs").value;
const pagamento = document.getElementById("pagamento").value;
const troco = document.getElementById("troco").value;

let pedido = "";
let total = 0;

carrinho.forEach(item => {

pedido +=
`🔥 ${item.pod}
🍓 ${item.sabor}
💰 R$ ${item.preco}

`;

 total += item.preco;

});

let mensagem =
`Olá, gostaria de fazer um pedido!

👤 Nome: ${nome}

🛒 PEDIDOS:

${pedido}

💵 Total: R$ ${total}

💳 Pagamento: ${pagamento}

📝 Observação: ${obs}`;

if(pagamento == "Dinheiro" && troco){

mensagem += `

💸 Troco para: R$ ${troco}`;

}

const numero = "558486774080";

const url =
`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

window.open(url,"_blank");

}

window.abrirAdmin = function(){

document.getElementById("adminModal").style.display = "block";

}

window.fecharAdmin = function(){

document.getElementById("adminModal").style.display = "none";

}

window.fazerLogin = function(){

const login = document.getElementById("login").value;
const senha = document.getElementById("senha").value;

if(login == "gbpods" && senha == "podsdogb2k26"){

document.getElementById("painelAdmin").style.display = "block";

carregarAdmin();

}else{

alert("Login inválido!");

}

}

window.adicionarProduto = function(){

const nome = document.getElementById("novoNome").value;
const preco = Number(document.getElementById("novoPreco").value);
const saboresTexto = document.getElementById("novoSabores").value;

const sabores = saboresTexto
.split(",")
.map(item => item.trim());

push(produtosRef, {
nome,
preco,
sabores
});

 document.getElementById("novoNome").value = "";
 document.getElementById("novoPreco").value = "";
 document.getElementById("novoSabores").value = "";

}

function carregarAdmin(){

const lista = document.getElementById("listaAdmin");

if(!lista) return;

lista.innerHTML = "";

produtos.forEach(produto => {

let saboresHTML = "";

produto.sabores.forEach(sabor => {

saboresHTML += `
<div class="sabor-tag">
${sabor}
</div>
`;

});

lista.innerHTML += `
<div class="admin-produto">
<h3>${produto.nome}</h3>
<p>R$ ${produto.preco}</p>
<div class="sabores-box">
${saboresHTML}
</div>
<button
onclick="editarProduto('${produto.firebaseId}')"
>
Editar
</button>
<button
onclick="removerProduto('${produto.firebaseId}')"
>
Remover
</button>
</div>
`;

});

}

window.removerProduto = function(id){

remove(ref(db, `produtos/${id}`));

}

window.editarProduto = function(id){

const produto = produtos.find(p => p.firebaseId == id);

const novoNome = prompt("Novo nome", produto.nome);
const novoPreco = prompt("Novo preço", produto.preco);

const novosSabores = prompt(
"Sabores separados por vírgula",
produto.sabores.join(", ")
);

update(ref(db, `produtos/${id}`), {
nome:novoNome,
preco:Number(novoPreco),
sabores:novosSabores
.split(",")
.map(item => item.trim())
});

}

</script>

</body>
</html>
