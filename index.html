<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CATÁLOGO DO GB PODS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#111;
      color:white;
    }

    header{
      padding:30px 20px;
      text-align:center;
      background:#000;
    }

    .logo{
      width:220px;
      height:220px;
      object-fit:cover;
      border-radius:50%;
      border:6px solid white;
      background:#000;
      box-shadow:0 0 30px rgba(255,255,255,0.2);
    }

    .titulo{
      margin-top:15px;
      font-size:32px;
      font-weight:bold;
      color:white;
      letter-spacing:2px;
    }

    .container{
      width:90%;
      max-width:550px;
      margin:30px auto;
      background:#1a1a1a;
      padding:25px;
      border-radius:20px;
      border:2px solid red;
      box-shadow:0 0 25px rgba(255,0,0,0.2);
    }

    h2{
      text-align:center;
      color:#ff3b3b;
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-top:18px;
      margin-bottom:8px;
      color:#ff4d4d;
      font-weight:bold;
    }

    select,
    input,
    textarea{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2a2a2a;
      color:white;
      font-size:15px;
    }

    textarea{
      height:100px;
      resize:none;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:15px;
      border:none;
      border-radius:12px;
      background:red;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#cc0000;
    }

    .resultado{
      margin-top:25px;
      background:#222;
      padding:20px;
      border-radius:15px;
      border:1px solid red;
    }

    .itemCarrinho{
      padding:12px;
      border-bottom:1px solid #444;
      margin-bottom:10px;
    }

    footer{
      text-align:center;
      padding:25px;
      color:#888;
    }

  </style>

</head>

<body>

<header>

  <img
    src="IMG-20260523-WA0008.jpg"
    class="logo"
  >

  <div class="titulo">
    TROPA GB PODS
  </div>

</header>

<div class="container">

  <h2>Monte Seu Pedido</h2>

  <!-- POD -->
  <label>Escolha o Pod</label>

  <select id="pod" onchange="atualizarSabores()">

    <option value="">
      Carregando pods...
    </option>

  </select>

  <!-- SABOR -->
  <label>Escolha o Sabor</label>

  <select id="sabores">

    <option>
      Escolha um pod primeiro
    </option>

  </select>

  <!-- NOME -->
  <label>Seu Nome</label>

  <input
    type="text"
    id="nome"
    placeholder="Digite seu nome"
  >

  <!-- OBS -->
  <label>Observação</label>

  <textarea
    id="obs"
    placeholder="Ex: troco, entrega rápida..."
  ></textarea>

  <!-- BOTÕES -->
  <button onclick="adicionarCarrinho()">
    Adicionar ao Carrinho
  </button>

  <button onclick="enviarWhatsapp()">
    Finalizar Pedido
  </button>

  <!-- CARRINHO -->
  <div class="resultado">

    <h2>
      🛒 Carrinho
    </h2>

    <div id="itensCarrinho"></div>

    <h3 style="margin-top:20px;">
      Total: R$ <span id="total">0</span>
    </h3>

    <!-- PAGAMENTO -->
    <label>Forma de Pagamento</label>

    <select id="pagamento" onchange="mostrarTroco()">

      <option value="">
        Selecione
      </option>

      <option value="Dinheiro">
        Dinheiro
      </option>

      <option value="Cartão">
        Cartão
      </option>

      <option value="Pix">
        Pix
      </option>

    </select>

    <!-- TROCO -->
    <div id="trocoArea" style="display:none;">

      <label>Troco Para Quanto?</label>

      <input
        type="number"
        id="troco"
        placeholder="Ex: 200"
      >

    </div>

  </div>

</div>

<footer>
  © 2026 TROPA GB PODS
</footer>

<script>

const supabaseUrl =
'https://quknbmwjfdteqlaysvwp.supabase.co'

const supabaseKey =
'sb_publishable_kB3PjpFhT42CBzbn9W0eQA_kgRjHXfH'

const client =
supabase.createClient(supabaseUrl, supabaseKey)

const sabores = {}

const precos = {}

let carrinho = []

async function carregarProdutos(){

  const { data, error } =
  await client
  .from('produtos')
  .select('*')
  .eq('estoque', true)

  if(error){

    console.log(error)
    return

  }

  const selectPod =
  document.getElementById("pod")

  selectPod.innerHTML =
  '<option value="">Selecione</option>'

  data.forEach(produto => {

    if(!sabores[produto.nome]){

      sabores[produto.nome] = []

      precos[produto.nome] = produto.preco

      const option =
      document.createElement("option")

      option.value = produto.nome

      option.textContent =
      `${produto.nome} - R$${produto.preco}`

      selectPod.appendChild(option)

    }

    sabores[produto.nome]
    .push(produto.sabor)

  })

}

// atualizar sabores
function atualizarSabores(){

  const pod =
  document.getElementById("pod").value

  const select =
  document.getElementById("sabores")

  select.innerHTML = ""

  if(!pod){

    select.innerHTML =
    "<option>Escolha um pod primeiro</option>"

    return

  }

  sabores[pod].forEach(sabor => {

    const option =
    document.createElement("option")

    option.value = sabor

    option.textContent = sabor

    select.appendChild(option)

  })

}

// adicionar carrinho
function adicionarCarrinho(){

  const pod =
  document.getElementById("pod").value

  const sabor =
  document.getElementById("sabores").value

  if(!pod){

    alert("Escolha um pod!")
    return

  }

  carrinho.push({

    pod,
    sabor,
    preco: Number(precos[pod])

  })

  atualizarCarrinho()

}

// atualizar carrinho
function atualizarCarrinho(){

  const itens =
  document.getElementById("itensCarrinho")

  const total =
  document.getElementById("total")

  itens.innerHTML = ""

  let soma = 0

  carrinho.forEach(item => {

    soma += item.preco

    itens.innerHTML += `

      <div class="itemCarrinho">

        <p><b>${item.pod}</b></p>

        <p>${item.sabor}</p>

        <p>R$ ${item.preco}</p>

      </div>

    `

  })

  soma += 3

  total.innerText = soma

}

// troco
function mostrarTroco(){

  const pagamento =
  document.getElementById("pagamento").value

  const trocoArea =
  document.getElementById("trocoArea")

  if(pagamento == "Dinheiro"){

    trocoArea.style.display = "block"

  }else{

    trocoArea.style.display = "none"

  }

}

// whatsapp
function enviarWhatsapp(){

  const nome =
  document.getElementById("nome").value

  const obs =
  document.getElementById("obs").value

  const pagamento =
  document.getElementById("pagamento").value

  const troco =
  document.getElementById("troco").value

  if(carrinho.length == 0){

    alert("Adicione produtos!")
    return

  }

  let pedido = ""

  let total = 0

  carrinho.forEach(item => {

    pedido +=
`🔥 ${item.pod}
🍓 ${item.sabor}
💰 R$ ${item.preco}

`

    total += item.preco

  })

  total += 3

  let mensagem =
`Olá, gostaria de fazer um pedido!

👤 Nome: ${nome}

🛒 PEDIDOS:

${pedido}

🚚 Taxa de entrega: R$3

💵 Total: R$ ${total}

💳 Pagamento: ${pagamento}

📝 Observação: ${obs}`

  if(pagamento == "Dinheiro" && troco){

    mensagem +=
`

💸 Troco para: R$ ${troco}`

  }

  const numero = "558486774080"

  const url =
`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`

  window.open(url, "_blank")

}

carregarProdutos()

</script>

</body>
      </html>
